<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - In game</title>

    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/screen.css">
    <link rel="stylesheet" href="../assets/css/board.css">

    <script src="../assets/js/sound-component/sound.js" type="module"></script>
    <script type="module" src="../assets/js/board-component/board.js"></script>
</head>
<body>
    <noscript>
        Javascript is required for this experience to work properly. Please enable it or use a modern browser with support.
    </noscript>
    <!-- Sidebar -->
    <aside>
        <!-- Other players -->
        <ol class="other-players">
            <template id="other-player-card-template">
                <li class="player-card">
                    <div class="left-content">
                        <header>
                            <h3 class="name">Player name</h3>
                            <h4 class="points"><span>Player points</span> pts.</h4>
                        </header>
                        <ul class="tokens"></ul>
                        <ul class="cards"></ul>
                        <ul class="reserved"></ul>
                    </div>
                </li>
            </template>
        </ol>
        <!-- History -->
        <ol class="history">
            <li>Game starts</li>
            <li>Round 1 starts</li>
            <li>
                <p><strong>Alice</strong> takes</p>
                <picture>
                    <source srcset="../assets/images/UI/tokens/red_chip.webp">
                    <img src="../assets/images/fallback/UI/tokens/red_chip.png" alt="Red Chip" title="Red chip">
                </picture>
                <p>,</p>
                <picture>
                    <source srcset="../assets/images/UI/tokens/blue_chip.webp">
                    <img src="../assets/images/fallback/UI/tokens/blue_chip.png" alt="Blue chip" title="Blue chip">
                </picture>
            </li>
            <li>
                <p><strong>Bob</strong> buys a </p>
                <picture>
                    <source srcset="../assets/images/UI/cards/blue_card_small.webp">
                    <img src="../assets/images/fallback/UI/cards/blue_card_small.png" alt="Blue card" title="Blue card">
                </picture>
                <p>card</p>
            </li>
            <li>
                <p><strong>You</strong> reserve a</p>
                <picture>
                    <source srcset="../assets/images/UI/cards/green_card_small.webp">
                    <img src="../assets/images/fallback/UI/cards/green_card_small.png" alt="Green card" title="Green card">
                </picture>
                <p>card</p>
            </li>
            <template id="take-tokens-history-template">
                <li>
                    <p><strong></strong> takes</p>
                </li>
            </template>

            <template id="buy-card-history-template">
                <li>
                    <p><strong></strong> buys a </p>
                    <p>card</p>
                </li>
            </template>

            <template id="reserve-card-history-template">
                <li>
                    <p><strong></strong> reserves a</p>
                    <p>card</p>
                </li>
            </template>

            <template id="receive-noble-history-template">
                <li>
                    <p><strong></strong> receives a noble</p>
                </li>
            </template>
        </ol>
    </aside>

    <section>
        <header class="top-bar">
            <h1>It's your turn</h1>
            <div>
                <button type="button" class="sound-button">
                    <picture>
                        <source srcset="../assets/images/UI/sound_off.webp" type="image/webp">
                        <img src="../assets/images/fallback/UI/sound_off.png" alt="Toggle sound" title="Toggle sound">
                    </picture>
                </button>
                <button type="button">Forfeit button</button>
                <h2>Username</h2>
                <div class="avatar"></div>
            </div>
        </header>
        <main>
            <!-- Decks -->
            <ul class="decks">
                <li class="level-3" data-deck-level="3">
                    <picture class="hidden-cards">
                        <source srcset="../assets/images/cards/empty/deck_level_3_top.webp" type="image/webp">
                        <img src="../assets/images/fallback/cards/empty/deck_level_3_top.png" alt="Deck level 3" title="Deck level 3">
                    </picture>
                    <!-- Cards in deck -->
                    <ul class="cards-in-deck"></ul>
                </li>
                <li class="level-2" data-deck-level="2">
                    <picture class="hidden-cards">
                        <source srcset="../assets/images/cards/empty/deck_level_2_top.webp" type="image/webp">
                        <img src="../assets/images/fallback/cards/empty/deck_level_2_top.png" alt="Deck level 2" title="Deck level 2">
                    </picture>
                    <!-- Cards in deck -->
                    <ul class="cards-in-deck"></ul>
                </li>
                <li class="level-1" data-deck-Level="1">
                    <picture class="hidden-cards">
                        <source srcset="../assets/images/cards/empty/deck_level_1_top.webp" type="image/webp">
                        <img src="../assets/images/fallback/cards/empty/deck_level_1_top.png" alt="Deck level 1" title="Deck level 1">
                    </picture>
                    <!-- Cards in deck -->
                    <ul class="cards-in-deck"></ul>
                </li>
            </ul>
            <!-- Board tokens -->
            <ul class="board-tokens"></ul>
            <!-- Nobles -->
            <ul class="nobles">
                <template id="noble-template">
                    <li></li>
                </template>
            </ul>
            <!-- Timer https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles -->
            <div class="timer" style="height: 100%;" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="45">
                <div class="timer-fill"></div>
            </div>
            <!-- Player points -->
            <section class="player-points">
                <h3>Points</h3>
                <div class="progress-bar-container">
                    <div class="progress-bar"></div>
                </div>
                <h4></h4>
                <picture class="hidden">
                    <source srcset="../assets/images/UI/tokens/white_chip.webp" type="image/webp">
                    <img src="../assets/images/fallback/UI/tokens/white_chip.png" alt="Score amongst the highest" title="Score amongst the highest" loading="lazy">
                </picture>
            </section>
            <!-- Reserved cards -->
            <section class="reserved-cards">
                <h3>Reserved</h3>
                <ul></ul>
            </section>
            <!-- Player tokens -->
            <section class="player-tokens">
                <header>
                    <h3>Tokens:</h3>
                    <h4><span id="current-tokens">Token count</span>/<span id="token-limit">Token limit</span></h4>
                </header>
                <ul>
                    <template id="token-discard-template">
                        <div class="discard-container">
                            <button type="button" data-action="remove">-</button>
                            <p data-amount="0" class="amount">0</p>
                            <button type="button" data-action="add">+</button>
                        </div>
                    </template>
                </ul>
            </section>
            <div class="button-container">
                <button type="button" class="reserve-button hidden">Reserve card</button>
                <button type="button" class="action-button">Action</button>
            </div>
        </main>
    </section>

    <template id="card-template">
        <li class="card">
            <p class="points"></p>
            <ul class="cost"></ul>
        </li>
    </template>

    <template id="numbered-item-template">
        <li>
            <p class="amount"></p>
        </li>
    </template>

    <template id="switch-tokens-container-template">
        <div class="switch-token-container">
            <button class="switch-token hidden">Switch one to gold</button>
            <p class="hidden">Selected: <span></span></p>
        </div>

    </template>

    <template id="image-template">
        <picture>
            <source srcset="#" type="image/webp">
            <img src="#" alt="" title="" loading="lazy">
        </picture>
    </template>

    <template id="progress-bar-template">
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>
    </template>
</body>
</html>
