<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author"
          content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - In game</title>

    <link rel="icon" type="image/png" sizes="64x64" href="../favicon-64x64.png">

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/screen.css">
    <link rel="stylesheet" href="../assets/css/board.css">

    <script type="module" src="../assets/js/board-component/board.js"></script>
</head>
<body>
<noscript>
    Javascript is required for this experience to work properly. Please enable it or use a modern browser with support.
</noscript>
<!-- Sidebar -->
<aside>
    <!-- Other players -->
    <ol class="other-players">
        <template id="other-player-card-template">
            <li class="player-card">
                <header>
                    <h3 class="name">Player name</h3>
                    <h4 class="points"><span>Player points</span> pts.</h4>
                </header>
                <ul class="tokens"></ul>
                <ul class="cards"></ul>
                <ul class="reserved"></ul>
            </li>
        </template>
    </ol>
    <!-- History -->
    <ol class="history">
        <template id="take-tokens-history-template">
            <li>
                <p><strong></strong> <span>took</span></p>
            </li>
        </template>

        <template id="discard-tokens-history-template">
            <li>
                <p><strong></strong> discarded</p>
            </li>
        </template>

        <template id="buy-card-history-template">
            <li>
                <p><strong></strong> bought a&nbsp;</p>
            </li>
        </template>

        <template id="reserve-card-history-template">
            <li>
                <p><strong></strong> reserved a&nbsp;</p>
            </li>
        </template>

        <template id="receive-noble-history-template">
            <li>
                <p><strong></strong> received a noble</p>
            </li>
        </template>

        <template id="forfeit-history-template">
            <li>
                <p><strong></strong> forfeited, what a coward!</p>
            </li>
        </template>

        <template id="skip-turn-history-template">
            <li>
                <p><strong></strong> skipped <span></span>&nbsp;turn</p>
            </li>
        </template>
    </ol>
</aside>

<div class="page-view">
    <header class="top-bar">
        <h1>It's your turn</h1>
        
        <div>
            <p class="amount-of-spectators">0</p>
            <picture class="spectator-eye-indicator">
                <source srcset="../assets/images/UI/spectator_indicator.webp" type="image/webp">
                <img src="../assets/images/fallback/UI/spectator_indicator.png" alt="spectators eye"
                     title="amount of spectators">
            </picture>
            <button type="button" class="sound-button">
                <picture>
                    <source srcset="../assets/images/UI/sound_off.webp" type="image/webp">
                    <img src="../assets/images/fallback/UI/sound_off.png" alt="Toggle sound" title="Toggle sound">
                </picture>
            </button>
            <button type="button" class="forfeit">
                <picture>
                    <source srcset="../assets/images/UI/forfeit.webp" type="image/webp">
                    <img src="../assets/images/fallback/UI/forfeit.png" alt="Forfeit" title="Forfeit">
                </picture>
            </button>
            <h2>playerName</h2>
            <div class="avatar"></div>
        </div>
    </header>
    <main>
        <!-- Decks -->
        <ul class="decks">
            <li class="level-3" data-deck-level="3">
                <picture class="hidden-cards">
                    <source srcset="../assets/images/cards/empty/deck_level_3_top.webp" type="image/webp">
                    <img src="../assets/images/fallback/cards/empty/deck_level_3_top.png" alt="Deck level 3"
                         title="Deck level 3">
                </picture>
                <!-- Cards in deck -->
                <ul class="cards-in-deck"></ul>
            </li>
            <li class="level-2" data-deck-level="2">
                <picture class="hidden-cards">
                    <source srcset="../assets/images/cards/empty/deck_level_2_top.webp" type="image/webp">
                    <img src="../assets/images/fallback/cards/empty/deck_level_2_top.png" alt="Deck level 2"
                         title="Deck level 2">
                </picture>
                <!-- Cards in deck -->
                <ul class="cards-in-deck"></ul>
            </li>
            <li class="level-1" data-deck-Level="1">
                <picture class="hidden-cards">
                    <source srcset="../assets/images/cards/empty/deck_level_1_top.webp" type="image/webp">
                    <img src="../assets/images/fallback/cards/empty/deck_level_1_top.png" alt="Deck level 1"
                         title="Deck level 1">
                </picture>
                <!-- Cards in deck -->
                <ul class="cards-in-deck"></ul>
            </li>
        </ul>
        <!-- Board tokens -->
        <ul class="board-tokens"></ul>
        <!-- Nobles -->
        <ul class="nobles">
            <template id="noble-template">
                <li></li>
            </template>
        </ul>
        <!-- Timer https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles -->
        <div class="timer" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="45">
            <div class="timer-fill"></div>
        </div>
        <!-- Player points -->
        <section class="player-points">
            <h3>Points</h3>
            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
            <h4>00 / 15</h4>
            <picture class="hidden">
                <source srcset="../assets/images/UI/diamond.webp" type="image/webp">
                <img src="../assets/images/fallback/UI/diamond.png" alt="Score amongst the highest"
                     title="Score amongst the highest" loading="lazy">
            </picture>
        </section>
        <!-- Reserved cards -->
        <section class="reserved-cards">
            <h4>No reserved cards</h4>
            <ul></ul>
        </section>
        <!-- Player tokens -->
        <section class="player-tokens">
            <header>
                <h3>Tokens:</h3>
                <h4><span id="current-tokens">Token count</span>/<span id="token-limit">Token limit</span></h4>
            </header>
            <ul>
                <template id="token-discard-template">
                    <div class="discard-container">
                        <button type="button" data-action="remove">
                            <!-- You might be wondering: "Why would we use images here instead of the + and - characters".
                            The reason for this is simple. The font that we use has spacing below and above these chars so making
                            the text large enough so that the average person can read it makes the container overflow. -->
                            <picture>
                                <source srcset="../assets/images/UI/minus.webp" type="image/webp">
                                <img src="../assets/images/fallback/UI/minus.png" alt="Remove from discard pile"
                                     loading="lazy">
                            </picture>
                        </button>
                        <p data-amount="0" class="amount">0</p>
                        <button type="button" data-action="add">
                            <picture>
                                <source srcset="../assets/images/UI/plus.webp" type="image/webp">
                                <img src="../assets/images/fallback/UI/plus.png" alt="Add to discard pile"
                                     loading="lazy">
                            </picture>
                        </button>
                    </div>
                </template>
            </ul>
        </section>
        <div class="button-container">
            <button type="button" class="reserve-button hidden">Reserve card</button>
            <button type="button" class="action-button">Action</button>
        </div>
    </main>
</div>

<!-- NOSONAR_BEGIN -->
<template id="card-template">
    <li class="card">
        <p class="points"></p>
        <ul class="cost"></ul>
    </li>
</template>
<!-- NOSONAR_END -->

<!-- NOSONAR_BEGIN -->
<template id="numbered-item-template">
    <li>
        <p class="amount"></p>
    </li>
</template>
<!-- NOSONAR_END -->

<template id="switch-tokens-container-template">
    <div class="switch-token-container">
        <button class="switch-token hidden">
            <picture>
                <source srcset="../assets/images/UI/switch_to_gold.webp" type="image/webp">
                <img src="../assets/images/fallback/UI/switch_to_gold.png" alt="Switch to gold" loading="lazy">
            </picture>
        </button>
    </div>
</template>

<template id="image-template">
    <picture>
        <source srcset="#" type="image/webp">
        <img src="#" alt="" title="" loading="lazy">
    </picture>
</template>

<template id="progress-bar-template">
    <div class="progress-bar-container">
        <div class="progress-bar"></div>
    </div>
</template>

<div class="unlocked-card-message"></div>
</body>
</html>
