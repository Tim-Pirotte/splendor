<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - Create game</title>

    <link rel="icon" type="image/png" sizes="64x64" href="../favicon-64x64.png">

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/screen.css">
    <link rel="stylesheet" href="../assets/css/create-game.css">

    <script type="module" src="../assets/js/sound-component/sound.js"></script>
    <script type="module" src="../assets/js/server-version-component/server-version.js"></script>
    <script type="module" src="../assets/js/create-game-component/create-game.js"></script>
</head>
<body>
    <noscript>
        Javascript is required for this experience to work properly. Please enable it or use a modern browser with support.
    </noscript>
    <header>
        <button type="button" id="back-button">
            <picture>
                <source srcset="./../assets/images/UI/back_button.webp" type="image/webp">
                <img src="./../assets/images/fallback/UI/back_button.png" alt="back arrow" title="back arrow">
            </picture>
        </button>
        <div id="playerInformation">
            <h2 id="playerName">playerName</h2>
            <template id="image-template">
                <picture>
                    <source srcset="#" type="image/webp">
                    <img src="#" alt="" title="">
                </picture>
            </template>
        </div>
    </header>
    <main>
        <h1>Create game</h1>
        <form method="post" action="#">
            <div>
                <label for="game-name">Game name:</label>
                <input type="text" id="game-name" placeholder="Alice's game" maxlength="25">
            </div>

            <div id="visibility-selector-container">
                <label for="private">Visibility:</label>
                <input type="radio" id="private" name="visibility" value="private" checked>
                <label for="private">private</label>
                <input type="radio" id="public" name="visibility" value="public">
                <label for="public">public</label>
            </div>

            <div>
                <label for="two-players">Number of players:</label>
                <input type="radio" id="two-players" name="players" value="2" checked>
                <label for="two-players">2</label>
                <input type="radio" id="three-players" name="players" value="3">
                <label for="three-players">3</label>
                <input type="radio" id="four-players" name="players" value="4">
                <label for="four-players">4</label>
            </div>

            <button type="submit">Create game</button>
        </form>
    </main>
    <footer>
        <button type="button" class="sound-button">
            <picture>
                <source srcset="../assets/images/UI/sound_off.webp" type="image/webp">
                <img src="../assets/images/fallback/UI/sound_off.png" title="sound button" alt="sound button">
            </picture>
        </button>
    </footer>
</body>
</html>
