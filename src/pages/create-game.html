<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author"
          content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - Create game</title>
    <link rel="stylesheet" href="../assets/css/screen.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/create-game.css">
</head>
<body>
    <noscript>Javascript is required for this experience to work properly. Please enable it or use a modern browser with support.</noscript>
    <nav>
        <span id="left-side">
        <!-- has a img that needs to be changed to a arrow icon making it go back to the home page/ previous page -->
        <a href="../index.html"><img src="../favicon-16x16.png" alt="back button"></a>
        </span>
        <div id="right-side">
            <!-- Mobey is here pure for testing reason will change with injection to match the username given also the img will get injected-->
            <p id="username">Mobley</p>
            <img src="../favicon-16x16.png" alt="User avatar">
        </div>
    </nav>
    <header>
        <h1>Create game</h1>
    </header>
    <main>
        <form action="#">
            <label for="game-name">Game name:</label>
            <input type="text" id="game-name" placeholder="Alice's game">
            <br>
            <label>Visibility:</label>
            <input type="radio" id="private" name="visibility" value="private" checked>
            <label for="private">private</label>
            <input type="radio" id="public" name="visibility" value="public">
            <label for="public">public</label>
            <br>
            <label>Number of players:</label>
            <input type="radio" id="two_players" name="players" value="2" checked>
            <label for="two_players">2</label>
            <input type="radio" id="three_players" name="players" value="3">
            <label for="three_players">3</label>
            <input type="radio" id="four_players" name="players" value="4">
            <label for="four_players">4</label>
            <br>
            <button>Create game</button>
        </form>
    </main>
    <footer>

    </footer>
</body>
</html>
