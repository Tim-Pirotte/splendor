<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - Lobby</title>

    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/screen.css">
    <link rel="stylesheet" href="../assets/css/lobby.css" type="text/css">

    <script type="module" src="../assets/js/lobby-component/lobby-page.js"></script>
    <script type="module" src="../assets/js/sound-component/sound-component.js"></script>
</head>
<body>
    <noscript>
        Javascript is required for this experience to work properly. Please enable it or use a modern browser with support
    </noscript>
    <header>
    </header>
    <main>
        <div id="players-container">
            <ul id="players">
                <li id="player-one">
                    <p>Mobly</p>
                    <picture>
                        <source srcset="../assets/images/UI/empty_icon.webp" type="images/webp">
                        <img src="../assets/images/fallback/UI/empty_icon.png" alt="Avatar selector">
                    </picture>
                </li>
                <li>
                    <p>Alice</p>
                    <picture>
                        <source srcset="../assets/images/UI/empty_icon.webp" type="images/webp">
                        <img src="../assets/images/fallback/UI/empty_icon.png" alt="Avatar selector">
                    </picture>
                </li>
                <template>
                    <li class="player">
                        <p class="player-name">Alice</p>
                        <picture>
                            <source srcset="../assets/images/UI/empty_icon.webp">
                            <img src="../assets/images/fallback/UI/empty_icon.png" alt="Avatar selector">
                        </picture>
                    </li>
                </template>
            </ul>
            <h4 id="joined-players">2/4</h4>
        </div>
    </main>
    <footer>
        <button type="button">Leave</button>
        <button type="button" class="sound-button">
            <picture>
                <source srcset="../assets/images/UI/sound_off.webp" type="image/webp">
                <img src="../assets/images/fallback/UI/sound_off.png" title="sound button" alt="sound button">
            </picture>
        </button>
    </footer>
</body>
</html>
