<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author"
    content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Lobby</title>

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/lobby.css" type="text/css">

    <script type="module" src="../assets/js/lobby-component/copy-to-clipboard.js"></script>


    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <noscript>Javascript is required for this experience to work properly. Please enable it or use a modern browser with support</noscript>
</body>
<header>
    <h1>Lobby</h1>
    <h2>
        Mobly's fantastic game name /
        <span id="game-id">123</span>
    </h2>
    <ion-icon id="copy-game-id-button" name="copy-outline"></ion-icon>
    <!-- TODO check if the line above is allowed -->
    <!-- TODO implement working copy to clipboard button-->
    <p>Created by Mobly</p>
    <!-- TODO game name to be inserted dynamically-->
</header>
<main>
    <ul>
        <li>
            <p>Mobly</p>
            <picture>
                <source srcset="../assets/images/UI/empty_icon.webp">
                <img src="../assets/images/fallback/UI/empty_icon.png" alt="Avatar selector">
            </picture>
        </li>
        <li>
            <p>Alice</p>
            <picture>
                <source srcset="../assets/images/UI/empty_icon.webp">
                <img src="../assets/images/fallback/UI/empty_icon.png" alt="Avatar selector">
            </picture>
        </li>
        <template>
            <li class="player">
                <p class="player-name">Alice</p>
                <picture>
                    <source srcset="../assets/images/UI/empty_icon.webp">
                    <img src="../assets/images/fallback/UI/empty_icon.png" alt="Avatar selector">
                </picture>
            </li>
        </template>
    </ul>
    <div>
        <h3>2/4</h3>
        <button type="button">Start</button>
    </div>
</main>
</html>
