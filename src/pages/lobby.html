<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - Lobby</title>

    <link rel="icon" type="image/png" sizes="64x64" href="../favicon-64x64.png">

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/screen.css">
    <link rel="stylesheet" href="../assets/css/lobby.css" type="text/css">

    <script type="module" src="../assets/js/lobby-component/lobby.js"></script>
</head>
<body>
    <noscript>
        Javascript is required for this experience to work properly. Please enable it or use a modern browser with support.
    </noscript>
    <header>
        <h1>Lobby</h1>
        <div>
            <h2 id="game-name-id">...</h2>
            <button type="button" id="copy-game-id-button">
                <picture>
                    <source srcset="../assets/images/UI/copyButton/copy_button_white.webp">
                    <img src="../assets/images/fallback/UI/copyButton/copy_button_white.png" alt="copy game id to clipboard">
                </picture>
            </button>
        </div>
        <div>
            <h3>Created by ...</h3>
            <h4 id="player-count">.../...</h4>
        </div>
    </header>
    <main>
        <ul id="joined-players">
            <template id="joined-player-template">
                <li class="player">
                    <p class="player-name"></p>
                    <picture>
                        <source srcset="../assets/images/avatars/placeholder.webp">
                        <img src="../assets/images/fallback/avatars/placeholder.png" alt="placeholder" title="placeholder">
                    </picture>
                </li>
            </template>
        </ul>
    </main>
    <footer>
        <button type="button" class="leave-button">Leave</button>
        <button type="button" class="sound-button">
            <picture>
                <source srcset="../assets/images/UI/sound_off.webp" type="image/webp">
                <img src="../assets/images/fallback/UI/sound_off.png" title="sound button" alt="sound button">
            </picture>
        </button>
    </footer>
</body>
</html>
