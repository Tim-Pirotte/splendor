<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="16x16" href="./../favicon-16x16.png">

    <meta name="author" content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - Join game</title>

    <link rel="stylesheet" href="./../assets/css/reset.css">
    <link rel="stylesheet" href="./../assets/css/screen.css">
    <link rel="stylesheet" href="./../assets/css/join-game.css">

     <script type="module" src="./../assets/js/join-game-component/join-game.js"></script>
</head>

<body>
    <noscript>
        Javascript is required for this experience to work properly. Please enable it or use a modern browser with support.
    </noscript>

    <div id="page-layout">
        <header>
            <button type="button">
                <picture>
                    <source srcset="../assets/images/no-image-demo.jpg" type="image/webp">
                    <img src="../assets/images/no-image-demo.jpg" alt="Back arrow" title="Back arrow">
                </picture>
            </button>
            <h1>Join game</h1>
            <h4>Mobley</h4>
        </header>
        <main>
            <form action="#">
                <label for="game-id">Game ID:</label>
                <input id="game-id" type="number" name="game-id-holder">
                <button type="submit">Join game</button>
            </form>
            <section>
                <h2>Available games</h2>
                <form id="filter-form" action="#">
                    <label for="game-name">Game name:</label>
                    <input id="game-name" type="text" name="game-name-holder" placeholder="E.g. Mobly's game">
                    <label for="amount-filter">Filter on amount:</label>
                    <select id="amount-filter" name="amount-filter">
                        <option value="any">Any</option>
                        <option value="2">2 players</option>
                        <option value="3">3 players</option>
                        <option value="4">4 players</option>
                    </select>
                </form>
                <ul>
                    <template id="game-template">
                        <li data-gameState="" data-gameId="">
                            <div class="game-info">
                                <h3></h3>
                                <p class="game-id"></p>
                            </div>
                            <p class="amount-of-players"></p>
                            <button type="button"></button>
                        </li>
                    </template>
                </ul>
            </section>
        </main>
        <footer>
            <button type="button">
                <picture>
                    <source srcset="../assets/images/no-image-demo.jpg" type="image/webp">
                    <img src="../assets/images/no-image-demo.jpg" title="sound button" alt="sound button">
                </picture>
            </button>
        </footer>
    </div>
</body>
</html>
