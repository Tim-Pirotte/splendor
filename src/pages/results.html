<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author"
          content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - Results</title>

    <link rel="icon" type="image/png" sizes="64x64" href="../favicon-64x64.png">

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/screen.css">
    <link rel="stylesheet" href="../assets/css/results.css">

    <script type="module" src="../assets/js/sound-component/sound.js"></script>
    <script type="module" src="../assets/js/server-version-component/server-version.js"></script>
    <script type="module" src="../assets/js/results-component/results.js"></script>
</head>
<body>
    <noscript>
        Javascript is required for this experience to work properly. Please enable it or use a modern browser with support.
    </noscript>
    <header>
        <h1>
            <picture>
                <!-- TODO add the loser text here as default -->
                <source srcset="../assets/images/UI/winner_text.webp" type="image/webp">
                <img src="../assets/images/fallback/UI/winner_text.png" alt="winner text" title="winner text">
            </picture>
        </h1>
    </header>
    <main>
        <!-- the table-container is needed to give this a set height
             this way the return to main menu button is always in the same spot
             giving the table itself a set height results in the table rows being stretched-->
        <div id="table-container">
            <table>
                <thead>
                <tr>
                    <th>Position</th>
                    <th>Name</th>
                    <th>Points</th>
                </tr>
                </thead>
                <tbody>
                <template id="result-template">
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </template>
                </tbody>
            </table>
        </div>
        <a id="return-to-menu" href="../index.html">Return to main menu</a>
    </main>
<footer>
    <button type="button" class="sound-button">
        <picture>
            <source srcset="../assets/images/UI/sound_off.webp" type="image/webp">
            <img src="../assets/images/fallback/UI/sound_off.png" title="sound button" alt="sound button">
        </picture>
    </button>
</footer>
</body>
</html>
