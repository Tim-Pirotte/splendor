<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - Results</title>

    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/screen.css">
    <link rel="stylesheet" href="../assets/css/results.css">

    <script src="../assets/js/results-component/results.js" type="module"></script>
    <script src="../assets/js/sound-component/sound.js" type="module"></script>
</head>
<body>
    <noscript>
        Javascript is required for this experience to work properly. Please enable it or use a modern browser with support.
    </noscript>
    <header>
        <picture>
            <source srcset="../assets/images/no-image-demo.jpg" type="image/webp">
            <img src="../assets/images/fallback/logo.png" alt="A Splendor game logo made in pixel art">
        </picture>
    </header>
    <main>
        <div>
            <h1>DEFEAT!</h1>
            <table>
                <thead>
                    <tr>
                        <th>Position</th>
                        <th>Name</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                    <template id="result-template">
                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <a href="./lobby-page.html">Back to the lobby</a>
        </div>
    </main>
    <footer>
        <button type="button" class="sound-button">
            <picture>
                <source srcset="../assets/images/UI/sound_off.webp" type="image/webp">
                <img src="../assets/images/fallback/UI/sound_off.png" alt="Toggle sound">
            </picture>
        </button>
    </footer>
</body>
</html>
