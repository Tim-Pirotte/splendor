<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Niels Clarysse, Alexander Engelrelst, Tristan Joos, Arne Persyn, Tim Pirotte, Niels Ryserhove">
    <title>Splendor - Main menu</title>

    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64x64.png">

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/screen.css">
    <link rel="stylesheet" href="assets/css/main-menu.css">

    <script type="module" src="assets/js/main-menu-component/index.js"></script>
</head>
<body>
    <noscript>
        Javascript is required for this experience to work properly. Please enable it or use a modern browser with support.
    </noscript>
    <div>
        <header>
            <div class="error-message"></div>
            <picture>
                <source srcset="./assets/images/logo.webp" type="image/webp">
                <img src="./assets/images/fallback/logo.png" alt="A Splendor game logo made in pixel art" title="Splendor logo">
            </picture>
        </header>
        <main>
            <form action="#">
                <label for="username">Username:</label>
                <input type="text" name="username" id="username" placeholder="E.g. claryn" maxlength="16">
                <div class="avatar-selector">
                    <button type="button" id="avatar"></button>
                    <section class="none">
                        <h2>Choose an avatar!</h2>
                        <ul>
                            <template id="image-template">
                                <picture>
                                    <source srcset="#" type="image/webp">
                                    <img src="#" alt="" title="">
                                </picture>
                            </template>
                        </ul>
                    </section>
                </div>
                <div class="form-actions">
                    <button type="submit" value="join-game">Join game</button>
                    <button type="submit" value="create-game">Create game</button>
                    <button type="submit" value="demo">Demo</button>
                </div>
            </form>
            <a href="pages/card-collection.html">Card collection</a>
        </main>
        <footer>
            <button type="button" class="sound-button" data-index="true">
                <picture>
                    <source srcset="./assets/images/UI/sound_off.webp" type="image/webp">
                    <img src="./assets/images/fallback/UI/sound_off.png" title="sound button" alt="sound button">
                </picture>
            </button>
        </footer>
    </div>
    <div class="error-message none"></div>
</body>
</html>
