image: registry.ci.infra.lan:5000/project-1:client-QA

stages: 
  - QA
  - deployment

cache:
  key: npm-cache
  paths:
    - node_modules/
  policy: pull-push

before_script:
  - if [ ! -d "node_modules" ]; then npm ci; fi
  - ln -s /ci/node_modules .

validate-html:
  stage: QA
  rules:
    - if:
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run validate-html

sonarqube:
  stage: QA
  needs:
    - validate-html
  rules:
    - if:
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run validate-sonar-ci

eslint:
  stage: QA
  needs:
    - validate-html
    - sonarqube
  rules:
    - if:
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npx eslint . --ext .js,.mjs,.cjs

deployment:
  stage: deployment
  image: registry.ci.infra.lan:5000/project-1:client-deploy
  needs:
    - validate-html
    - sonarqube
    - eslint
  rules:
    - if:
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    year: 2024-2025
  script:
    - echo "Deploying to group directory"
    - rsync -e "ssh" -r src/ gitlab-runner@project-1.edu.technet.howest.be:/opt/${year}/${CI_PROJECT_NAMESPACE##*/}/client
